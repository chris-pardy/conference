[package]
name = "conference-server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[dev-dependencies]
serde_json = "1"
