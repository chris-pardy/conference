# Each job runs the same package script a developer runs locally; `pnpm check`
# runs all four in order. The job names are the required checks in
# .github/rulesets/main.json, so renaming one means updating the ruleset too.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A PR's runs share a group, so a newer push cancels the older run. Every run
# on main gets its own group: GitHub cancels a *pending* run whenever another
# joins its group, whatever cancel-in-progress says, and each main commit must
# be checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium
      # The tooling tests commit to throwaway git repos.
      - run: |
          git config --global user.name "CI"
          git config --global user.email "ci@users.noreply.github.com"
      - run: pnpm check:test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  frozen-tests:
    runs-on: ubuntu-latest
    steps:
      # The PR's own head commit with full history, not GitHub's merge into main.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      # The branch under test mustn't be able to switch off its own policing:
      # once main has the enforcement scripts, they come from main.
      - name: Use main's frozen-tests enforcement
        run: |
          for f in scripts/frozen-tests.sh scripts/check-tests-unchanged.sh; do
            if git cat-file -e "origin/main:$f" 2>/dev/null; then
              git show "origin/main:$f" > "$f"
            fi
          done
          if [ "$(jq -r '.scripts["check:frozen"]' package.json)" != "bash scripts/frozen-tests.sh" ]; then
            echo "package.json's check:frozen must run scripts/frozen-tests.sh" >&2
            exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm check:frozen
